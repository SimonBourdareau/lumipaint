<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <!--
    The same lockup for a light page.

    Only the two neutrals change places: the near-white of the text and the white keys
    becomes near-black, and the dark of the black keys becomes pale. The gradient, the
    cyan key and the cyan in the name are untouched - they carry the identity and read
    on either background, which is why they are the ones left alone.

    The dark version is still the one the software uses; this exists because a wordmark
    in #f2f2f4 is invisible on GitHub in light mode.
-->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b30"/><stop offset="0.28" stop-color="#ffd60a"/>
      <stop offset="0.55" stop-color="#30d158"/><stop offset="0.78" stop-color="#00c4ff"/>
      <stop offset="1" stop-color="#9c6aff"/>
    </linearGradient>
    <filter id="s" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <rect x="26" y="52" width="148" height="36" rx="18" fill="url(#g)" filter="url(#s)" opacity="0.95"/>
  <rect x="34" y="24" width="42" height="88" rx="7" fill="#1a1a1f"/>
  <rect x="78" y="24" width="42" height="88" rx="7" fill="#00c4ff"/>
  <rect x="122" y="24" width="42" height="88" rx="7" fill="#1a1a1f"/>
  <rect x="64" y="24" width="27" height="54" rx="5" fill="#f2f2f4"/>
  <rect x="108" y="24" width="27" height="54" rx="5" fill="#f2f2f4"/>
  <rect x="34" y="118" width="130" height="6" rx="3" fill="url(#g)"/>

  <text x="200" y="94" font-family="Segoe UI, Calibri, DejaVu Sans, sans-serif"
        font-size="76" font-weight="600" fill="#1a1a1f">Lumi<tspan fill="#00c4ff">Paint</tspan></text>
  <text x="202" y="140" font-family="Segoe UI, Calibri, DejaVu Sans, sans-serif"
        font-size="26" fill="#6a6a75">a colour for every note</text>
</svg>
